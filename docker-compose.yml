version: '3.8'

services:
  ikev2-vpn:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-ikev2-server:latest
    container_name: ikev2-vpn
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      # 证书挂载
      - ./certs/ca.pem:/etc/swanctl/x509ca/ca.pem:ro
      - ./certs/server-cert.pem:/etc/swanctl/x509/server-cert.pem:ro
      - ./certs/server-key.pem:/etc/swanctl/private/server-key.pem:ro
      # 多用户凭据挂载
      #- ./config/users.conf:/etc/swanctl/conf.d/users.conf:ro
      - ./config/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./config/strongswan.conf:/etc/strongswan.conf:ro
    environment:
      - VPN_HOST=vpn.yourdomain.com
      - VPN_SUBNET=10.10.10.0/24
      - VPN_DNS=1.1.1.1,8.8.8.8
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.send_redirects=0
